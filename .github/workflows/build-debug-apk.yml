name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'APK/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled + packages)
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and copy APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" PulchraDomina-v1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulchraDomina-v1.0.0-debug
          path: PulchraDomina-v1.0.0-debug.apk
          retention-days: 14

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0-debug >/dev/null 2>&1; then
            gh release upload v1.0.0-debug PulchraDomina-v1.0.0-debug.apk --clobber
          else
            gh release create v1.0.0-debug \
              --title "Pulchra Domina v1.0.0 (Debug)" \
              --notes "Debug build com ícone do corvo (bico à direita) + sistema de atualização real via GitHub Releases. Compatível com Android 8.0+ (minSdk 26)." \
              --prerelease \
              PulchraDomina-v1.0.0-debug.apk
          fi
