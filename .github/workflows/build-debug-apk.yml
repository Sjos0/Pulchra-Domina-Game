name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'APK/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          cp "$APK" PulchraDomina-v1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulchraDomina-v1.0.0-debug
          path: PulchraDomina-v1.0.0-debug.apk
          retention-days: 14

      - name: Update Release with new APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete old asset if release exists, then upload new one
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/v1.0.0-debug --jq .id 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            gh release create v1.0.0-debug \
              --title "Pulchra Domina v1.0.0 (Debug)" \
              --notes "Debug build com ícone do corvo + sistema de atualização real. minSdk 26 (Android 8+)." \
              --prerelease \
              PulchraDomina-v1.0.0-debug.apk
          else
            # Remove existing apk asset
            ASSET_ID=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets --jq '.[] | select(.name=="PulchraDomina-v1.0.0-debug.apk") | .id' 2>/dev/null || true)
            if [ -n "$ASSET_ID" ]; then
              gh api -X DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID || true
            fi
            gh release upload v1.0.0-debug PulchraDomina-v1.0.0-debug.apk --clobber
          fi
