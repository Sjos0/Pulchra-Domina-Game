name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'APK/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Use the Android SDK preinstalled on GitHub-hosted runners
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          ls /usr/local/lib/android/sdk/ || true
          ls /usr/local/lib/android/sdk/platforms/ || true
          ls /usr/local/lib/android/sdk/build-tools/ || true

      - name: Install required Android packages
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;35.0.0" "platform-tools" || \
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
          # Accept licenses non-interactively
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and copy APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" PulchraDomina-v1.0.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulchraDomina-v1.0.2-debug
          path: PulchraDomina-v1.0.2-debug.apk
          retention-days: 14

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.2-debug >/dev/null 2>&1; then
            gh release upload v1.0.2-debug PulchraDomina-v1.0.2-debug.apk --clobber
          else
            gh release create v1.0.2-debug \
              --title "Pulchra Domina v1.0.0 (Debug)" \
              --notes "Debug build com ícone do corvo (bico à direita) + sistema de atualização real. Android 8.0+ (minSdk 26)." \
              --prerelease \
              PulchraDomina-v1.0.2-debug.apk
          fi
